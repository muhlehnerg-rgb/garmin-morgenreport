name: Telegram Inbox

on:
  push:
    paths:
      - ".github/workflows/telegram_bot.yml"
      - "telegram_inbox.py"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: telegram-inbox
  cancel-in-progress: false

jobs:
  inbox:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install requests google-cloud-firestore

      - name: Schluessellos bei Google Cloud anmelden
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/872101045107/locations/global/workloadIdentityPools/github-actions/providers/garmin-github-actions
          service_account: github-cockpit-inbox@gewohnheitstracker-3b30a.iam.gserviceaccount.com

      - name: Telegram-Nachrichten in die Inbox uebernehmen
        env:
          FIRESTORE_PROJEKT: gewohnheitstracker-3b30a
          FIREBASE_USER_UID: Q3hX1JXrnwV3nJa5wS7RQTrlCQi1
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_inbox.py
